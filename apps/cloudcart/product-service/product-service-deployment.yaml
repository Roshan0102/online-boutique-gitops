apiVersion: apps/v1
kind: Deployment

metadata:
  name: product-service
  namespace: cloudcart-dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: product-service

  template:
    metadata:
      labels:
        app: product-service

    spec:
      containers:
        - name: product-service

          image: roshan033/cloudcart-product-service:build-20

          imagePullPolicy: Always

          ports:
            - containerPort: 5002

          envFrom:
            - configMapRef:
                name: product-service-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
