deploymentMode: SingleBinary

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    storageClass: gp2
    size: 10Gi

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13

        index:
          prefix: loki_index_
          period: 24h

gateway:
  enabled: true

chunksCache:
  enabled: false

resultsCache:
  enabled: false
