apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: online-boutique-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Roshan0102/online-boutique-gitops.git

    targetRevision: main

    path: apps/online-boutique

  destination:
    server: https://kubernetes.default.svc

    namespace: online-boutique-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true