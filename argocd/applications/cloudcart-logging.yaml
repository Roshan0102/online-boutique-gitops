apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: logging
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.38.0

      helm:
        valueFiles:
          - $values/apps/logging/values.yaml

    - repoURL: https://grafana.github.io/helm-charts
      chart: promtail
      targetRevision: 6.17.0

      helm:
        values: |
          config:
            clients:
              - url: http://logging-loki-gateway.logging.svc.cluster.local/loki/api/v1/push

    - repoURL: https://github.com/Roshan0102/online-boutique-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: logging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
