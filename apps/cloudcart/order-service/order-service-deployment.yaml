apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: cloudcart-dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service

          image: roshan033/cloudcart-order-service:v1

          imagePullPolicy: Always

          ports:
            - containerPort: 5003

          envFrom:
            - configMapRef:
                name: order-service-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: order-service-secret
                  key: JWT_SECRET
