apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cloudcart-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Roshan0102/online-boutique-gitops.git

    targetRevision: main

    path: apps/cloudcart

  destination:
    server: https://kubernetes.default.svc

    namespace: cloudcart-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
