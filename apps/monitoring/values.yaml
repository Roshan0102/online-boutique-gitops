grafana:
  adminPassword: admin123

  ingress:
    enabled: true
    ingressClassName: nginx

    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod

    hosts:
      - grafana.pramod-leveling.space

    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.pramod-leveling.space

prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx

    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod

    hosts:
      - prometheus.pramod-leveling.space

    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.pramod-leveling.space

  prometheusSpec:
    retention: 15d

alertmanager:
  enabled: true

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
