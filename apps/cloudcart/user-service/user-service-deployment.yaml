apiVersion: apps/v1
kind: Deployment

metadata:
  name: user-service
  namespace: cloudcart-dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service

          image: roshan033/cloudcart-user-service:build-0

          imagePullPolicy: Always

          ports:
            - containerPort: 5001

          envFrom:
            - configMapRef:
                name: user-service-config

          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: user-service-secret
                  key: JWT_SECRET

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
